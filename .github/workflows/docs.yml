name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "sphinx>=9" "sphinx-autodoc-typehints>=3" furo "myst-parser>=4" "sphinx-copybutton>=0.5"
          # diaxcondel.viz refuses to import without matplotlib, and autosummary
          # imports a module before autodoc's mocks apply. The heavier extras
          # (siibra, streamlit, plotly) stay mocked.
          pip install matplotlib
      - name: Build
        # Optional extras are mocked in conf.py, so the docs build needs only
        # the core dependencies. Warnings are errors: a broken cross-reference
        # in a docstring should fail here rather than reach the site.
        run: sphinx-build -b html docs docs/_build/html --fail-on-warning
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
